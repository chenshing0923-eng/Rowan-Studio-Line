<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><link rel="stylesheet" href="base.css">
<style>
/* 左：預約諮詢（x0–1250）｜右上：網站製作（x1250–2500, y240–1099）｜右下三格（各約 417 寬） */
.main { display: grid; grid-template-columns: 1198px 1fr 1fr 1fr; grid-template-rows: 820px 1fr; gap: 26px; }
.big { grid-row: 1 / 3; padding: 96px 96px 90px; display: flex; flex-direction: column; }
.rings { position: absolute; right: -200px; top: -280px; width: 860px; height: 860px; border-radius: 50%; border: 4px solid rgba(43,179,163,.32); }
.rings::after { content: ""; position: absolute; inset: 130px; border-radius: 50%; border: 4px solid rgba(43,179,163,.22); }
.big .icon { width: 160px; height: 160px; border-radius: 44px; }
.big .icon svg { width: 88px; height: 88px; }
.big .eyebrow { margin-top: auto; font-size: 46px; }
.big h1 { font-size: 128px; font-weight: 700; line-height: 1.18; margin-top: 18px; letter-spacing: .01em; white-space: nowrap; }
.big p { font-size: 58px; line-height: 1.55; margin-top: 24px; }
.reply { font-size: 54px; margin-top: 26px; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
.reply svg { width: 54px; height: 54px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.big .rule { margin: 46px 0 46px; }
.foot2 { display: flex; align-items: center; justify-content: space-between; gap: 30px; }
.foot2 .price { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
.foot2 .cur { font-family: "Inter", sans-serif; font-weight: 800; font-size: 50px; color: #B7C2BD; }
.foot2 b { font-family: "Inter", sans-serif; font-weight: 800; font-size: 112px; letter-spacing: -.03em; line-height: 1; }
.foot2 .muted { font-size: 54px; }
.go { align-self: flex-start; background: #2BB3A3; color: #FFFFFF; font-size: 60px; font-weight: 700; padding: 26px 56px; border-radius: 999px; white-space: nowrap; }

/* 網站製作：右上寬卡，暖金色重點 */
.web { grid-column: 2 / 5; padding: 76px 70px 76px 80px; display: flex; gap: 50px; background: linear-gradient(135deg, #FFFDF8, #F7EFE1); border-color: #E9DCC3; }
.web .txt { flex: 1; display: flex; flex-direction: column; }
.web .eyebrow { color: #B7863A; font-size: 44px; }
.web h2 { font-size: 132px; font-weight: 700; line-height: 1.08; margin-top: 18px; }
.web p { font-size: 58px; margin-top: 18px; }
.web .tag { margin-top: auto; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
.web .tag .cur { font-family: "Inter", sans-serif; font-weight: 800; font-size: 50px; color: #8C7A5C; }
.web .tag b { font-family: "Inter", sans-serif; font-weight: 800; font-size: 136px; letter-spacing: -.03em; line-height: 1; color: #1F2A2E; }
.web .tag span { font-size: 54px; color: #8C7A5C; }
.web .more { align-self: flex-start; margin-top: 30px; font-size: 52px; font-weight: 700; color: #FFFFFF; background: #C29A55; padding: 16px 40px; border-radius: 999px; }
.web .tag i { font-style: normal; margin-left: 26px; font-size: 52px; font-weight: 700; color: #FFFFFF; background: #C29A55; padding: 14px 34px; border-radius: 999px; align-self: center; }
.mock { width: 420px; flex: none; align-self: center; border-radius: 26px; background: #FFFFFF; box-shadow: 0 30px 60px -24px rgba(90,64,20,.35), 0 0 0 3px #EADFC9; overflow: hidden; transform: rotate(-3deg); }
.mock .bar { height: 44px; background: #1F2A2E; display: flex; align-items: center; gap: 12px; padding: 0 20px; }
.mock .bar i { width: 14px; height: 14px; border-radius: 50%; background: #56666C; }
.mock .hero { height: 200px; background: linear-gradient(160deg, #1F2A2E, #2E4640); padding: 36px 32px; display: flex; flex-direction: column; gap: 16px; }
.mock .hero span { display: block; height: 26px; width: 70%; border-radius: 8px; background: #E9EEEB; }
.mock .hero span.s { width: 45%; height: 18px; background: #7E918B; }
.mock .hero em { display: block; width: 150px; height: 40px; border-radius: 999px; background: #2BB3A3; margin-top: auto; }
.mock .body { padding: 28px 32px 34px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.mock .body i { height: 84px; border-radius: 14px; background: #F1ECE2; }

/* 右下三格：內容集中、置中 */
.small { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px; }
.small .icon { width: 118px; height: 118px; border-radius: 34px; }
.small .icon svg { width: 64px; height: 64px; }
.small h2 { font-size: 78px; font-weight: 700; line-height: 1.1; margin-top: 30px; }
.small p { font-size: 46px; margin-top: 12px; }
.small.hot { background: #2BB3A3; border-color: #2BB3A3; color: #FFFFFF; }
.small.hot .icon { background: rgba(255,255,255,.2); color: #FFFFFF; }
.small.hot p { color: #E6FAF5; }
</style></head><body>
<div class="tabs"><div class="tab on"><b>首頁</b><i>HOME</i></div><div class="tab"><b>方案</b><i>PLANS</i></div><div class="tab"><b>單項</b><i>À LA CARTE</i></div></div>
<div class="main">
  <div class="card dark big"><div class="rings"></div>
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 4C7 4 3 7.2 3 11.2c0 3.6 3.2 6.6 7.5 7.1l-.4 2.3 3.3-2.3c4.4-.3 7.6-3.4 7.6-7.1C21 7.2 17 4 12 4z"/><path d="M8 10v3M8 13h2M12 10v3M15 10v3M15 10l2 3M17 10v3"/></svg></div>
    <div class="eyebrow">LINE OFFICIAL ACCOUNT</div>
    <h1>LINE 官方帳號<br>建置・代管</h1>
    <p class="muted">圖文選單、自動回覆、AI 客服<br>幫你把 LINE 做到會自己接客</p>
    <div class="rule"></div>
    <div class="foot2"><div class="price"><span class="cur">NT$</span><b>3,500</b><span class="muted">起</span></div><div class="go">看服務內容 →</div></div>
  </div>
  <div class="card web">
    <div class="txt">
      <div class="eyebrow">WEBSITE DESIGN</div>
      <h2>網站製作</h2>
      <p class="muted">網站＋LINE 一起開店</p>
      <div class="tag"><span class="cur">NT$</span><b>9,800</b><span>起</span></div><div class="more">看網站方案 →</div>
    </div>
    <div class="mock"><div class="bar"><i></i><i></i><i></i></div><div class="hero"><span></span><span class="s"></span><em></em></div><div class="body"><i></i><i></i><i></i></div></div>
  </div>
  <div class="card small"><div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5L5 20"/></svg></div><h2>作品範例</h2><p class="muted">各行業設計</p></div>
  <div class="card small hot"><div class="icon"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg></div><h2>免費諮詢</h2><p>24 小時內回覆</p></div>
  <div class="card small"><div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg></div><h2>常見問題</h2><p class="muted">時程・付款</p></div>
</div></body></html>
