<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Rowan Studio 圖文選單（2500×1686）</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
<style>
  /* LINE 圖文選單：大型 2500×1686，三欄兩列。區塊位置要和 scripts/setup-richmenu.mjs 的 areas 一致 */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; background: #0C1311; overflow: hidden; }
  body { font-family: "Noto Sans TC", "Plus Jakarta Sans", sans-serif; color: #ECEFE8; padding: 22px; }
  .grid { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 22px; }
  .cell { position: relative; border-radius: 48px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
    background: radial-gradient(70% 60% at 50% 110%, rgba(111,221,185,.16), transparent 70%), linear-gradient(165deg, #1B2A25, #131D1A); border: 3px solid #26342F; }
  .cell.warm { background: radial-gradient(70% 60% at 50% 110%, rgba(240,182,107,.22), transparent 70%), linear-gradient(165deg, #241F17, #16130E); border-color: #3A3122; }
  .cell.hot { background: radial-gradient(80% 70% at 30% 0%, rgba(255,255,255,.35), transparent 60%), linear-gradient(165deg, #7FE3C3, #4FC7A6); border-color: #8BE8C9; color: #07231B; }
  .icon { width: 220px; height: 220px; border-radius: 64px; display: flex; align-items: center; justify-content: center; background: rgba(111,221,185,.14); color: #6FDDB9; }
  .warm .icon { background: rgba(240,182,107,.16); color: #F0B66B; }
  .hot .icon { background: rgba(7,35,27,.12); color: #07231B; }
  .icon svg { width: 120px; height: 120px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-size: 132px; font-weight: 900; letter-spacing: .04em; line-height: 1; }
  .en { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 40px; letter-spacing: .32em; color: #8FA69D; margin-top: -10px; }
  .hot .en { color: #0F5A48; }
  .warm .en { color: #B69A72; }
  .brand { position: absolute; right: 40px; bottom: 34px; display: flex; align-items: center; gap: 16px; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 38px; color: #8FA69D; }
  .brand svg { width: 56px; height: 56px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.6 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5V8M12 16v1.5"/></svg></div><div class="label">方案價格</div><div class="en">PRICING</div></div>
    <div class="cell"><div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5L5 20"/></svg></div><div class="label">作品範例</div><div class="en">WORKS</div></div>
    <div class="cell warm"><div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg></div><div class="label">網站製作</div><div class="en">WEBSITE</div></div>
    <div class="cell hot"><div class="icon"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg></div><div class="label">免費諮詢</div><div class="en">FREE CONSULT</div></div>
    <div class="cell"><div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg></div><div class="label">常見問題</div><div class="en">FAQ</div></div>
    <div class="cell"><div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div><div class="label">官方網站</div><div class="en">ROWAN-STUDIO</div>
      <div class="brand"><svg viewBox="0 0 400 400"><rect width="400" height="400" rx="92" fill="#ECEFE8"/><path d="M128 300 V100 H216 A56 56 0 0 1 216 212 H128 M196 212 L272 292" fill="none" stroke="#0C1311" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="296" r="26" fill="#2BB3A3"/></svg>Rowan Studio</div>
    </div>
  </div>
</body>
</html>
